name: mmm-notebooks
channels:
  - conda-forge
  - defaults

dependencies:
  # Python runtime (matches setup.py requirement)
  - python=3.11

  # Jupyter
  - jupyterlab>=4.0.0
  - ipykernel>=6.25.0
  - ipywidgets>=8.1.0
  - notebook>=7.0.0

  # Data
  - pandas>=2.0.0
  - numpy>=1.24.0
  - xarray>=2023.1.0
  - pyarrow>=14.0.0
  - openpyxl>=3.1.2
  - xlrd>=2.0.1

  # Visualisation
  - matplotlib>=3.7.0
  - seaborn>=0.13.0
  - altair>=5.0.0

  # Scientific
  - scipy>=1.11.0
  - scikit-learn>=1.3.0

  # Utilities
  - pyyaml>=6.0.1
  - python-dotenv>=1.0.0
  - tqdm>=4.66.0

  # pip-only packages
  - pip
  - pip:
      # Logging
      - loguru>=0.7.2

      # JAX — CPU build (swap to jax[cuda12] for GPU)
      - "jax[cpu]>=0.4.20"
      - jaxlib>=0.4.20

      # TensorFlow stack (required by Meridian)
      - tensorflow>=2.16.0
      - tensorflow-probability>=0.24.0

      # Probabilistic programming
      - numpyro>=0.15.0

      # Google Meridian
      - google-meridian>=1.3.2

      # Pydantic (used internally by the platform)
      - pydantic>=2.5.0
